name: Playwright browser tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WECODE_DISPOSABLE_E2E: 'yes'
      WECODE_E2E_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/setup_env.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Seed only the disposable CI database
        run: docker compose exec -T -e WECODE_DISPOSABLE_E2E=yes web python - < e2e/seed.py
      - run: python -m unittest discover -s e2e -p 'test_*.py' -v
      - name: Save Compose logs
        if: always()
        run: |
          mkdir -p e2e-results
          docker compose logs --no-color > e2e-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: e2e-results/
          retention-days: 7
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down -v
