name: Backend and PostgreSQL
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wecode
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wecode_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wecode -d wecode_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WECODE_TEST_DATABASE_URL: postgresql://wecode:ci-only-password@localhost:5432/wecode_test
      AUTH_SECRET: ci-only-authentication-secret-not-used-outside-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt httpx==0.28.1
      - run: python -m unittest discover -s tests -v
      - run: docker build -t wecode-assignment2:ci .
      - run: python scripts/setup_env.py
      - run: docker compose config --quiet
