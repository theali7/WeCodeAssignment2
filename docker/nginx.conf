server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This preview must not send authentication/data requests to production Supabase.
    add_header Content-Security-Policy "connect-src 'self'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
