# Render Blueprint is not literal Docker Compose execution. See RENDER_SETUP.md.
services:
  - type: web
    name: wecode-assignment2
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wecode-assignment2-db
          property: connectionString
databases:
  - name: wecode-assignment2-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: wecode
    user: wecode
    ipAllowList: []
